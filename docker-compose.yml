services:
  m5wireless:
    build: .
    ports:
      - "8000:8000"
    environment:
      # La URL del webhook NO se hardcodea aqui: se hereda del entorno.
      M5W_WEBHOOK_URL: ${M5W_DISCORD_WEBHOOK}
      M5W_UI_TOKEN: ${M5W_UI_TOKEN}
      # Si accedes desde otra maquina, declara el host: M5W_ALLOWED_HOSTS=mi-host
      M5W_ALLOWED_HOSTS: ${M5W_ALLOWED_HOSTS}
    volumes:
      - ./data:/app/data
